# رؤوس أمنية — يُضمَّن على كل location (توارث nginx ينكسر عند add_header داخل location).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# ملاحظة: لا تُضف upgrade-insecure-requests قبل تفعيل TLS الكامل — تحويل طلبات http إلى https يكسر الموقع (لا شهادة بعد).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
