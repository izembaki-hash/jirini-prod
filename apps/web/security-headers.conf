# رؤوس أمنية — يُضمَّن على كل location (توارث nginx ينكسر عند add_header داخل location).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# ملاحظة: لا تُضف upgrade-insecure-requests — الموقع يُخدَم كذلك عبر IP بلا TLS فينكسر.
# يُضاف لاحقًا server_name مخصّص (jiriny.com فقط) إذا لزم.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; script-src 'self' https://connect.facebook.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.facebook.com https://i.ytimg.com; connect-src 'self' https://connect.facebook.net https://www.facebook.com" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
