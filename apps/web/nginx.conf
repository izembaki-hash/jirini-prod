server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # رؤوس أمنية على مستوى السيرفر — ترثها location / (SPA fallback) لأنها بلا add_header خاص.
  # أما Locations التي تعرّف add_header فهوّا نفسها فانكسر التوارث → تضمّن الملف داخلها.
  include /etc/nginx/security-headers.conf;

  # index.html: أبداً يُخزّن مؤقتاً (المحتوى يحدد اسماء الـassets المُجزأة).
  location = / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }
  location /billing/return {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri /index.html;
  }

  # أصول مُجزأة (Vite): اسم الملف يحتوي هاش — آمن للتخزين طويل المدى.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
