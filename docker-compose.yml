services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع كلمة سر قوية في .env}
      POSTGRES_DB: ${POSTGRES_DB:-dzsaas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &log-rot
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dzsaas}?schema=public
      PORT: 4000
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # الصحة الحقيقية: الـAPI يعمل وموصول على postgres — أي fallback للذاكرة = غير صحي
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>r.json()).then(j=>process.exit(j.ok&&j.db==='postgres'?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *log-rot

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ | grep -q '<div id=\"root\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *log-rot

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web
    logging: *log-rot

volumes:
  pgdata:
  uploads:
  caddydata:
  caddyconfig:
